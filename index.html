<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>My Life OS</title><style>
:root{--bg:#f4f5f2;--card:#fff;--tx:#1d2521;--mu:#68736d;--ac:#1f6b57;--ac2:#e8f1ed;--bd:#dde2de;--wr:#b3441c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1a211e;--tx:#e6ece8;--mu:#93a19a;--ac:#5fc4a3;--ac2:#203029;--bd:#2c3833;--wr:#f2946a;color-scheme:dark}}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Georgia,'Times New Roman',serif}
*{box-sizing:border-box}button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}nav{width:200px;padding:14px 10px;border-right:1px solid var(--bd);background:var(--card);flex:none}
nav h1{font-size:18px;margin:4px 8px 12px}nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;font-family:system-ui,sans-serif;font-size:14px}
nav button.on{background:var(--ac2);color:var(--ac);font-weight:600}main{flex:1;padding:16px;min-width:0;max-width:1000px}
#tb{position:sticky;top:0;z-index:5;background:var(--ac);color:#fff;padding:6px 12px;border-radius:8px;margin-bottom:12px;font-family:system-ui,sans-serif;display:none;gap:8px;align-items:center;flex-wrap:wrap}
h2{margin:0 0 10px;font-size:22px}h3{margin:14px 0 6px;font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.b{border:1px solid var(--bd);background:var(--card);border-radius:6px;padding:6px 11px;cursor:pointer;font-family:system-ui,sans-serif;font-size:13px;margin:2px}
.b.p{background:var(--ac);color:#fff;border-color:var(--ac)}.b.d{color:var(--wr)}
.mu{color:var(--mu);font-size:13px}.wr{color:var(--wr)}.bar{height:8px;background:var(--ac2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-family:system-ui,sans-serif;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
input,select,textarea{border:1px solid var(--bd);background:var(--card);border-radius:6px;padding:6px 8px;width:100%;margin:2px 0 8px}
#md{position:fixed;inset:0;background:#0007;display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:20;padding:20px 10px}
#md>div{background:var(--card);border-radius:10px;padding:16px;width:min(560px,100%)}label{font-family:system-ui,sans-serif;font-size:12px;color:var(--mu)}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:10px;padding:0 8px;font-size:12px;font-family:system-ui,sans-serif}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:30;font-family:system-ui,sans-serif}
@media(max-width:700px){#app{flex-direction:column}nav{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:6}nav h1{display:none}nav button{white-space:nowrap;width:auto}}
</style></head><body><div id="app"><nav id="nav"></nav><main><div id="tb"></div><div id="v"></div></main></div><div id="md"><div id="mc"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9),iso=d=>{d=d||new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)},today=()=>iso(),addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const KEYS=['tasks','prospects','clients','placements','money','subjects','revise','checkins','journal','practices','sessions','services','portfolio'];
let S={skills:{},road:{}},store=true,view='dash',tab={crm:'prospects',free:'skills',acad:'tasks'},q={},T={run:false,left:1500,total:1500,end:0,task:'',brk:false},V={state:'Ready',text:'',cmd:null,rec:null};
KEYS.forEach(k=>S[k]=[]);
try{const r=localStorage.getItem('lifeos1');if(r)Object.assign(S,JSON.parse(r))}catch(e){store=false}
function save(){try{localStorage.setItem('lifeos1',JSON.stringify(S));store=true}catch(e){store=false}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2500)}
const PIPE=['Newly discovered','Awaiting evaluation','Under review','Qualified','Rejected','Contact info found','Outreach draft prepared','Contacted','Follow-up due','Response received','Negotiation','Accepted','Content preparation','Article submitted','Editorial review','Published','Link verified','Completed','On hold','Lost'];
const CHK=['Topical relevance','Real audience value','Content usefulness','Organic traffic history','Traffic consistency','Publisher credibility','Editorial standards','Outbound link quality','Spam warning signs','Suspicious link patterns','Contact/ownership transparency','Commercial placement policy'];
const CS=['Not checked','Good','Needs review','Poor','N/A'],CUR=['PKR','USD','EUR','GBP','AED'],CAT=['Freelance','Academic','Wellbeing','Faith','Planning'];
const SK=['Guest post prospecting','Website research','Niche relevance assessment','Website quality evaluation','Organic traffic analysis','SEO metrics understanding','Publisher communication','Blogger outreach','Email writing','Follow-up communication','Negotiation','Content coordination','Anchor text selection','Target URL management','Link verification','Client reporting','Campaign management','Relationship management'];
const LV=['Not assessed','1 Beginner','2 Basic understanding','3 Can do with guidance','4 Works independently','5 Can manage & explain'];
const ROAD=['Assess current skills & readiness','Improve key technical + communication skills','Create practical portfolio samples (marked SAMPLE)','Prepare profile and service descriptions','Identify suitable clients and agencies','Begin personalized outreach','Review replies, improve proposals, build relationships'];
const ST=['Not started','In progress','Waiting','Completed','Deferred','Cancelled'];
// field: [key,label,type,options,required]
const E={
tasks:{n:'Task',f:[['title','Task name','text',0,1],['cat','Category','sel',CAT],['pri','Priority','sel',['High','Medium','Low']],['status','Status','sel',ST],['due','Deadline','date'],['mins','Estimated minutes','num'],['src','Source module','sel',['Manual','Freelance HQ','CRM','Academic','Wellbeing','Faith','Voice']],['next','Next action (5-10 min)','text'],['notes','Notes','area']],cols:['title','cat','pri','status','due','mins'],d:{cat:'Freelance',pri:'Medium',status:'Not started',src:'Manual'}},
prospects:{n:'Prospect',f:[['domain','Domain (example.com)','dom',0,1],['url','Website URL','url'],['niche','Niche','text'],['country','Country','text'],['stage','Pipeline stage','sel',PIPE],['dr','Ahrefs DR','num'],['da','Moz DA','num'],['traffic','Est. organic traffic','num'],['msrc','Metric source (tool)','text'],['mdate','Date checked','date'],['mtype','Metric entry','sel',['Manually entered','Imported','Independently verified']],['email','Contact email','email'],['fdate','Follow-up date','date'],['fcount','Follow-ups sent','num'],['reply','Reply status','sel',['No reply yet','Replied','Declined','Negotiating']],['price','Quoted price','num'],['cur','Currency','sel',CUR],['why','Evaluation explanation','area'],...CHK.map((c,i)=>['c'+i,'Check: '+c,'sel',CS])],cols:['domain','niche','country','stage','dr','fdate','reply'],d:{stage:PIPE[0],cur:'USD',reply:'No reply yet',fcount:0,...Object.fromEntries(CHK.map((c,i)=>['c'+i,'Not checked']))}},
clients:{n:'Client',f:[['name','Client / business','text',0,1],['contact','Primary contact','text'],['email','Email','email'],['stage','Stage','sel',['Lead','Contacted','Replied','Discussion','Negotiation','Won','Active Project','Completed','Retained','Lost']],['source','Source','text'],['service','Service required','text'],['site','Target website','url'],['anchor','Desired anchor text','text'],['budget','Budget','num'],['cur','Currency','sel',CUR],['due','Deadline','date'],['fdate','Next follow-up','date'],['notes','Notes / communication history','area']],cols:['name','stage','service','budget','cur','fdate'],d:{stage:'Lead',cur:'PKR'}},
placements:{n:'Placement',f:[['client','Client','text',0,1],['pub','Publisher domain','dom',0,1],['aurl','Article URL','url'],['turl','Target page URL','url'],['anchor','Anchor text','text'],['title','Article title','text'],['pdate','Publication date','date'],['attr','Link attribute','sel',['Not checked','Followed (no restrictive rel detected)','Nofollow','Sponsored','UGC','Multiple','Unknown']],['status','Link status','sel',['Not checked','Live','Removed','Redirected','Not found','Verification failed']],['vdate','Last verified','date'],['evid','Verification evidence (required to verify)','text'],['fee','Agreed fee','num'],['cur','Currency','sel',CUR],['inv','Invoice status','sel',['Not invoiced','Invoiced','Paid']],['notes','Notes','area']],cols:['client','pub','status','attr','vdate','inv'],d:{attr:'Not checked',status:'Not checked',cur:'PKR',inv:'Not invoiced'}},
money:{n:'Money record',f:[['type','Type','sel',['Quote','Agreed value','Invoice issued','Payment received','Expense']],['amt','Amount','num',0,1],['cur','Currency','sel',CUR],['date','Date','date'],['note','Note (client / tool)','text']],cols:['type','amt','cur','date','note'],d:{type:'Payment received',cur:'PKR'}},
services:{n:'Service',f:[['name','Service','text',0,1],['on','Active?','sel',['Inactive','Active']],['ability','Current ability','sel',LV],['deliv','Deliverables','text'],['hrs','Est. hours','num'],['price','Pricing approach','text'],['proof','Portfolio evidence','text']],cols:['name','on','ability','price'],d:{on:'Inactive',ability:LV[0]}},
portfolio:{n:'Portfolio project',f:[['title','Project title','text',0,1],['kind','Type','sel',['SAMPLE / DEMO','Real client work']],['skills','Skills demonstrated','text'],['deliv','Deliverables','text'],['ready','Readiness','sel',['Draft','Needs improvement','Portfolio-ready']],['notes','Improvement notes','area']],cols:['title','kind','ready'],d:{kind:'SAMPLE / DEMO',ready:'Draft'}},
subjects:{n:'Subject',f:[['name','Subject (e.g. Jurisprudence)','text',0,1],['exam','Exam date','date'],['notes','Notes / reading list','area']],cols:['name','exam']},
revise:{n:'Difficult topic',f:[['topic','Topic','text',0,1],['subj','Subject','text'],['status','Status','sel',['Needs revision','Revising','Understood']],['notes','What confuses me','area']],cols:['topic','subj','status'],d:{status:'Needs revision'}},
checkins:{n:'Check-in',f:[['date','Date','date'],['mood','Mood (1 low - 5 high)','sel',['1','2','3','4','5']],['energy','Energy','sel',['1','2','3','4','5']],['stress','Stress','sel',['1','2','3','4','5']],['sleep','Sleep quality','sel',['1','2','3','4','5']],['move','Activity (minutes)','num'],['obs','Obstacle today','sel',['None','Fear of failure','Lack of clarity','Perfectionism','Distraction','Overthinking','Low energy','Overload','Low confidence']]],cols:['date','mood','energy','stress','sleep','move','obs'],d:{mood:'3',energy:'3',stress:'3',sleep:'3',obs:'None'}},
journal:{n:'Journal entry',f:[['date','Date','date'],['good','What went well?','area'],['bad','What bothered me?','area'],['avoid','What am I avoiding?','area'],['grat','Grateful for','area'],['imp','What to improve','area'],['next','One positive action tomorrow','text']],cols:['date','next'],d:{}},
practices:{n:'Practice',f:[['name','Practice name (you choose)','text',0,1],['sched','Schedule / reminder note','text'],['goal','Personal goal / value','text']],cols:['name','sched','goal']}};
const dflt=k=>({...(E[k].d||{}),...(k=='checkins'||k=='journal'?{date:today()}:{}),...(k=='money'?{date:today()}:{})});
const isOpen=t=>!['Completed','Cancelled'].includes(t.status),over=t=>isOpen(t)&&t.due&&t.due<today();
// ---------- generic CRUD
function openM(h){$('#mc').innerHTML=h;$('#md').style.display='flex'}function closeM(){$('#md').style.display='none'}
function edit(k,id,pre){const e=E[k],r=id?S[k].find(x=>x.id==id):{...dflt(k),...(pre||{})};
openM(`<h3>${id?'Edit':'Add'} ${e.n}</h3><form id="fm" onsubmit="return sv(event,'${k}','${id||''}')">`+e.f.map(([f,l,t,o,rq])=>{const v=r[f]??'';let i;
if(t=='sel')i=`<select name="${f}">${o.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
else if(t=='area')i=`<textarea name="${f}" rows="2">${esc(v)}</textarea>`;
else i=`<input name="${f}" value="${esc(v)}" type="${t=='date'?'date':t=='num'?'number':'text'}" ${t=='num'?'step="any" min="0"':''} ${rq?'required':''}>`;
return `<label>${l}${rq?' *':''}</label>${i}`}).join('')+`<button class="b p">Save</button><button type="button" class="b" onclick="closeM()">Cancel</button><div id="er" class="wr"></div></form>`)}
function sv(ev,k,id){ev.preventDefault();const e=E[k],o={};let err='';
e.f.forEach(([f,l,t])=>{let v=new FormData($('#fm')).get(f);v=(v||'').trim?(v||'').trim():v;
if(t=='dom'&&v){v=v.replace(/^https?:\/\//,'').replace(/\/.*$/,'').toLowerCase();if(!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(v))err=l+' is not a valid domain.'}
if(t=='url'&&v&&!/^https?:\/\/\S+\.\S+/.test(v))err=l+' must start with http:// or https://';
if(t=='email'&&v&&!/^\S+@\S+\.\S+$/.test(v))err=l+' is not a valid email.';
if(t=='num'&&v!==''&&(isNaN(v)||+v<0))err=l+' must be a positive number.';o[f]=v});
if(k=='placements'&&o.status=='Live'&&(!o.evid||!o.vdate))err='To mark a link Live, add verification evidence and the verified date.';
if(err){$('#er').textContent=err;return false}
if(k=='tasks'){const old=id&&S.tasks.find(x=>x.id==id);if(o.status=='Completed'&&!(old&&old.doneAt))o.doneAt=today();else if(old&&o.status==old.status)o.doneAt=old.doneAt}
if(id){const i=S[k].findIndex(x=>x.id==id);S[k][i]={...S[k][i],...o}}else S[k].push({id:uid(),created:today(),...o});
save();closeM();toast('Saved');render();return false}
function del(k,id){if(confirm('Delete this record? This cannot be undone.')){S[k]=S[k].filter(x=>x.id!=id);save();render()}}
function rows(k,{extra,filter,add=1}={}){const e=E[k];let l=S[k].filter(filter||(()=>1));const s=(q[k]||'').toLowerCase();if(s)l=l.filter(r=>JSON.stringify(r).toLowerCase().includes(s));
const lab=Object.fromEntries(e.f.map(f=>[f[0],f[1]]));
return `<div class="card"><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><button class="b p" onclick="edit('${k}')">+ Add ${e.n}</button><input style="max-width:200px;margin:0" placeholder="Search…" value="${esc(q[k]||'')}" oninput="q['${k}']=this.value;render('${k}')" id="s_${k}"><span class="mu">${l.length} shown</span></div><div class="tw"><table><tr>${e.cols.map(c=>`<th>${esc((lab[c]||c).split(' (')[0])}</th>`).join('')}<th></th></tr>`+
(l.length?l.map(r=>`<tr>${e.cols.map(c=>`<td>${c=='status'||c=='stage'?`<span class="tag">${esc(r[c])}</span>`:esc(r[c])}</td>`).join('')}<td style="white-space:nowrap">${extra?extra(r):''}<button class="b" onclick="edit('${k}','${r.id}')">Edit</button><button class="b d" onclick="del('${k}','${r.id}')">Delete</button></td></tr>`).join(''):`<tr><td colspan="9" class="mu">Nothing here yet. Add your first ${e.n.toLowerCase()}.</td></tr>`)+`</table></div></div>`}
function taskFrom(title,cat,src,due,next){S.tasks.push({id:uid(),created:today(),title,cat,src,due,pri:'Medium',status:'Not started',next:next||''});save();toast('Task added to planner')}
// ---------- timer
function bar(){const b=$('#tb'),m=Math.floor(T.left/60),s=T.left%60,on=T.run||T.left<T.total;b.style.display=on?'flex':'none';
b.innerHTML=`<b>${T.brk?'Break':'Focus'} ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</b><span>${esc(T.task||'')}</span>`+(T.run?`<button class="b" onclick="pauseT()">Pause</button>`:`<button class="b" onclick="resumeT()">Resume</button>`)+`<button class="b" onclick="stopT()">Stop</button><button class="b" onclick="resetT()">Reset</button>`}
function startT(min,task,brk){clearInterval(T.h);T={run:true,total:min*60,left:min*60,end:Date.now()+min*6e4,task:task||'',brk:!!brk};T.h=setInterval(tick,500);bar()}
function tick(){T.left=Math.max(0,Math.round((T.end-Date.now())/1e3));if(T.left<=0){clearInterval(T.h);T.run=false;if(!T.brk){logS(Math.round(T.total/60),T.task,'Timer completed');}toast('Session finished');T.left=T.total;T.done=1;T.total=T.left;T.left=T.total;bar();render();$('#tb').style.display='none';return}bar()}
function pauseT(){if(!T.run)return;clearInterval(T.h);T.run=false;bar()}
function resumeT(){if(T.run||T.left<=0)return;T.end=Date.now()+T.left*1e3;T.run=true;T.h=setInterval(tick,500);bar()}
function resetT(){clearInterval(T.h);T.run=false;T.left=T.total;bar()}
function stopT(){clearInterval(T.h);const el=Math.floor((T.total-T.left)/60);T.run=false;if(!T.brk&&el>=1&&confirm(`Log ${el} minute(s) of focus work${T.task?' on "'+T.task+'"':''}?`))logS(el,T.task,'Stopped early, confirmed by you');T.left=T.total;bar();render()}
function logS(m,task,note){S.sessions.push({id:uid(),date:today(),mins:m,task,note});save()}
function manualLog(){const m=+prompt('Minutes of work to record?');if(m>0){const t=prompt('What did you work on?')||'';logS(m,t,'Manually recorded');render()}}
// ---------- views
const NAV=[['dash','Home'],['plan','Planner & Focus'],['free','Freelance HQ'],['crm','Guest Post CRM'],['acad','LLB Academic'],['well','Wellbeing'],['faith','Faith & Character'],['voice','Voice Commands'],['rev','Weekly Review'],['set','Settings & Backup']];
function go(v){view=v;render()}
function prog(cat){const t=S.tasks.filter(x=>x.cat==cat&&x.status!='Cancelled'),d=t.filter(x=>x.status=='Completed').length;return t.length?`<div class="bar"><i style="width:${d/t.length*100}%"></i></div><span class="mu">${d} of ${t.length} tasks done</span>`:'<span class="mu">No tasks recorded yet</span>'}
const pri={High:0,Medium:1,Low:2},sortT=(a,b)=>(over(b)-over(a))||(pri[a.pri]-pri[b.pri])||(a.due||'9').localeCompare(b.due||'9');
const tkRow=t=>`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:3px 0"><b>${esc(t.title)}</b> <span class="tag">${esc(t.cat)}</span>${t.due?`<span class="${over(t)?'wr':'mu'}">${over(t)?'overdue ':''}${esc(t.due)}</span>`:''}${t.next?`<span class="mu">Next: ${esc(t.next)}</span>`:''}${isOpen(t)?`<button class="b" onclick="done('${t.id}')">Done</button><button class="b" onclick="stuck('${t.id}')">Stuck?</button><button class="b" onclick="startT(25,'${esc(t.title).replace(/'/g,'')}')">▶ 25m</button>`:''}</div>`;
function done(id){const t=S.tasks.find(x=>x.id==id);t.status='Completed';t.doneAt=today();save();render()}
function dash(){const open=S.tasks.filter(isOpen).sort(sortT),pick=c=>open.find(t=>c.includes(t.cat)),P=[['Income task',pick(['Freelance'])],['Academic task',pick(['Academic'])],['Wellbeing / faith',pick(['Wellbeing','Faith'])]];
const wk=addD(-6),days=new Set(S.sessions.filter(s=>s.date>=wk).map(s=>s.date)).size,sk=Object.values(S.skills).filter(x=>x>0).length,h=new Date().getHours();
return `<h2>${h<12?'Good morning':h<18?'Good afternoon':'Good evening'} · ${new Date().toDateString()}</h2><div class="card"><b>Today's mission:</b> finish the three priorities below, then stop. Small steady work beats big plans.<br><button class="b p" onclick="edit('tasks')">+ Task</button><button class="b" onclick="edit('prospects')">+ Prospect</button><button class="b" onclick="startT(25)">Start focus</button><button class="b" onclick="manualLog()">Record work session</button><button class="b" onclick="edit('clients')">+ Client follow-up</button><button class="b" onclick="go('well')">Journal</button><button class="b" onclick="go('voice')">🎤 Voice</button><button class="b" onclick="go('rev')">Weekly review</button></div>
<h3>Three priorities</h3><div class="g">${P.map(([l,t])=>`<div class="card"><span class="mu">${l}</span><br>${t?tkRow(t):'<span class="mu">None yet. <a href="#" onclick="edit(\'tasks\');return false">Add one</a></span>'}</div>`).join('')}</div>
<h3>Progress (from your records)</h3><div class="g"><div class="card"><b>Guest posting skills</b><br><span class="mu">${sk} of ${SK.length} skills self-assessed · ${S.prospects.length} prospects · ${S.placements.filter(p=>p.status=='Live').length} verified live links</span></div><div class="card"><b>Freelance</b>${prog('Freelance')}</div><div class="card"><b>Academic</b>${prog('Academic')}</div><div class="card"><b>Wellbeing</b>${prog('Wellbeing')}<span class="mu"><br>${S.checkins.filter(c=>c.date>=wk).length} check-ins this week</span></div><div class="card"><b>Faith & character</b>${prog('Faith')}<span class="mu"><br>${S.practices.length} practices set by you</span></div><div class="card"><b>Execution consistency</b><div class="bar"><i style="width:${days/7*100}%"></i></div><span class="mu">Focus on ${days} of last 7 days</span></div></div>
<h3>Today & overdue</h3><div class="card">${open.filter(t=>over(t)||t.due==today()).map(tkRow).join('')||'<span class="mu">Nothing due today.</span>'}</div>`}
const TIPS={'I do not know where to start':'Write only the first physical action, e.g. "open the sheet and add one domain".','The task is too large':'Cut it until it takes 10 minutes. Do just that piece.','I fear failure':'Aim for a rough draft nobody will see. A bad first version is allowed.','I am afraid of making mistakes':'Mistakes in a draft are free. Fix them in a second pass.','I am distracted by social media':'Put the phone in another room for one 10-minute sprint.','I am tired':'Take a 5-minute walk or water break, then do a tiny 5-minute version.','I am overthinking':'Set a 5-minute timer and act before deciding more.','I am waiting for perfect conditions':'Start now at 60% quality; conditions will never be perfect.','I lack a clear deadline':'Give it a deadline today, even a soft one.','I have too many competing priorities':'Pick the one that matters most today. The rest can wait.'};
function stuck(id){openM(`<h3>What is in the way?</h3><p class="mu">No guilt. Let's find the real obstacle.</p>`+Object.keys(TIPS).map((k,i)=>`<button class="b" style="display:block;width:100%;text-align:left" onclick="fix('${id}',${i})">${k}</button>`).join('')+`<button class="b" onclick="closeM()">Close</button>`)}
function fix(id,i){const k=Object.keys(TIPS)[i],t=S.tasks.find(x=>x.id==id);openM(`<h3>${k}</h3><p>${TIPS[k]}</p><p class="mu">Write a 5–10 minute restart action:</p><input id="nx" value="${esc(t.next||'')}" placeholder="e.g. Open the sheet and list 3 sites"><button class="b p" onclick="t=S.tasks.find(x=>x.id=='${id}');t.next=$('#nx').value;t.stuck=(t.stuck||0)+1;save();closeM();startT(10,t.title)">Save and start 10 min</button><button class="b" onclick="closeM()">Later</button>`)}
function plan(){const f=q.pf||'open',l=S.tasks.filter(t=>f=='all'||(f=='open'?isOpen(t):f=='over'?over(t):t.status==f)).sort(sortT);
const ev=[...S.tasks.filter(isOpen&&(t=>t.due)).map(t=>[t.due,'Task',t.title]),...S.prospects.filter(p=>p.fdate).map(p=>[p.fdate,'Publisher follow-up',p.domain]),...S.clients.filter(c=>c.fdate).map(c=>[c.fdate,'Client follow-up',c.name]),...S.subjects.filter(s=>s.exam).map(s=>[s.exam,'Exam',s.name])].filter(e=>e[0]>=today()).sort().slice(0,15);
return `<h2>Planner & focus</h2><div class="card"><b>Focus timer</b> <span class="mu">(connected to a task)</span><div style="display:flex;gap:6px;flex-wrap:wrap"><select id="ft" style="max-width:260px"><option value="">No task</option>${S.tasks.filter(isOpen).map(t=>`<option>${esc(t.title)}</option>`).join('')}</select><input id="fm2" type="number" value="25" min="1" style="max-width:80px"><button class="b p" onclick="startT(+$('#fm2').value||25,$('#ft').value)">Start</button><button class="b" onclick="startT(5,'',1)">5-min break</button></div><span class="mu">Timer sessions are logged only when finished, or when you confirm after stopping.</span></div>
<div class="card"><select style="max-width:200px" onchange="q.pf=this.value;render()">${['open','over','all',...ST].map(x=>`<option ${x==f?'selected':''} value="${x}">${x=='over'?'Overdue':x}</option>`).join('')}</select>${l.map(tkRow).join('')||'<span class="mu">No tasks match.</span>'}</div>${rows('tasks')}
<h3>Upcoming calendar (Asia/Karachi)</h3><div class="card">${ev.map(e=>`<div>${e[0]} · <span class="tag">${e[1]}</span> ${esc(e[2])}</div>`).join('')||'<span class="mu">Dated items appear here.</span>'}<div class="mu">Browser reminders cannot run while this page is closed.</div></div>
<h3>Focus history</h3><div class="card">${S.sessions.slice(-8).reverse().map(s=>`<div>${s.date} · ${s.mins} min ${esc(s.task)} <span class="mu">${esc(s.note)}</span></div>`).join('')||'<span class="mu">No sessions yet.</span>'}</div>`}
function tabs(g,l){return `<div>${l.map(([k,n])=>`<button class="b ${tab[g]==k?'p':''}" onclick="tab['${g}']='${k}';render()">${n}</button>`).join('')}</div>`}
function money(){const R={};S.money.forEach(m=>{(R[m.cur]=R[m.cur]||{})[m.type]=(R[m.cur][m.type]||0)+ +m.amt});
return `<div class="g">${Object.entries(R).map(([c,r])=>`<div class="card"><b>${c}</b><br>Quoted ${r['Quote']||0} · Agreed ${r['Agreed value']||0}<br>Invoiced ${r['Invoice issued']||0}<br><b>Received ${r['Payment received']||0}</b> · Expenses ${r['Expense']||0}<br><b>Net ${(r['Payment received']||0)-(r['Expense']||0)}</b></div>`).join('')||'<div class="card mu">No money records yet.</div>'}</div><p class="mu">Currencies are never mixed. Only "Payment received" counts as income; unpaid invoices do not.</p>`+rows('money')}
function free(){let b='';const t=tab.free;
if(t=='skills')b=`<p class="mu">Rate yourself honestly. Add evidence in your portfolio.</p><div class="card">`+SK.map(s=>`<div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span>${s}</span><select style="max-width:210px" onchange="S.skills['${s}']=+this.value;save()">${LV.map((l,i)=>`<option value="${i}" ${(S.skills[s]||0)==i?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')+'</div>';
if(t=='road')b=`<p class="mu">30-day launch plan. It tracks activity, not promised income.</p><div class="card">`+ROAD.map((r,i)=>`<label style="display:block;color:inherit;font-size:14px"><input type="checkbox" style="width:auto" ${S.road[i]?'checked':''} onchange="S.road[${i}]=this.checked;save()"> Phase ${i+1}: ${r}</label>`).join('')+'</div>';
if(t=='svc')b=rows('services');if(t=='port')b=`<p class="mu">Practice projects must stay labelled SAMPLE / DEMO. Never present them as client results.</p>`+rows('portfolio');if(t=='fin')b=money();
return `<h2>Freelance HQ</h2>`+tabs('free',[['skills','Skills'],['road','30-day plan'],['svc','Services'],['port','Portfolio'],['fin','Finance']])+b}
function crm(){const t=tab.crm;let b='';
if(t=='prospects'){const f=q.pstage||'';b=`<select style="max-width:240px" onchange="q.pstage=this.value;render()"><option value="">All stages</option>${PIPE.map(p=>`<option ${p==f?'selected':''}>${p}</option>`).join('')}</select><p class="mu">DR, DA and traffic are third-party estimates, not Google scores. Record the tool and date. Missing values are left blank.</p>`+rows('prospects',{filter:r=>!f||r.stage==f,extra:r=>`<button class="b" onclick="followT('${r.id}')">Follow-up task</button><button class="b" onclick="draft('${r.id}')">Draft</button>`})}
if(t=='clients')b=rows('clients');if(t=='pl')b=`<p class="mu">Placements are marked Live only with evidence and a verification date.</p>`+rows('placements')+`<button class="b" onclick="report()">Generate client report</button>`;
return `<h2>Guest Post & Link-Building CRM</h2>`+tabs('crm',[['prospects','Prospects'],['clients','Clients'],['pl','Placements']])+b}
function followT(id){const p=S.prospects.find(x=>x.id==id);taskFrom('Follow up with '+p.domain,'Freelance','CRM',p.fdate||addD(3),'Check replies, then send one personalized follow-up');render()}
function draft(id){const p=S.prospects.find(x=>x.id==id);openM(`<h3>Outreach draft (not sent)</h3><p class="mu">Edit and personalize before sending from your own email. Nothing is sent from here.</p><textarea rows="12">Subject: Guest post idea for ${p.domain}\n\nHi [Name],\n\nI read [a specific article on ${p.domain}] and liked [specific detail]. I would like to suggest a guest article on [topic] for your ${p.niche||'[niche]'} readers.\n\nProposed title: [title]\nWhy it helps your audience: [reason]\n\nIf you accept guest contributions, could you share your guidelines and any sponsorship/disclosure policy?\n\nThank you,\n[Your name]</textarea><button class="b" onclick="closeM()">Close</button>`)}
function report(){const c=prompt('Client name for the report (exactly as recorded)?');if(!c)return;const l=S.placements.filter(p=>p.client==c&&p.status=='Live');openM(`<h3>Report: ${esc(c)}</h3><p class="mu">${l.length} verified live placement(s). Unverified items excluded.</p><div class="tw"><table><tr><th>Publisher</th><th>Article</th><th>Target</th><th>Anchor</th><th>Attribute</th><th>Verified</th></tr>${l.map(p=>`<tr><td>${esc(p.pub)}</td><td>${esc(p.aurl)}</td><td>${esc(p.turl)}</td><td>${esc(p.anchor)}</td><td>${esc(p.attr)}</td><td>${esc(p.vdate)}</td></tr>`).join('')}</table></div><p class="mu">Outstanding: ${S.placements.filter(p=>p.client==c&&p.status!='Live').length}. Use your browser's print / save-as-PDF.</p><button class="b" onclick="window.print()">Print</button><button class="b" onclick="closeM()">Close</button>`)}
function acad(){const t=tab.acad;let b='';
if(t=='tasks')b=`<button class="b p" onclick="edit('tasks',0,{cat:'Academic',src:'Academic'})">+ Assignment / study task</button><div class="card">${S.tasks.filter(x=>x.cat=='Academic').sort(sortT).map(tkRow).join('')||'<span class="mu">No academic tasks. They also appear in the Planner.</span>'}</div><button class="b" onclick="manualLog()">Record study session</button>`;
if(t=='sub')b=rows('subjects');if(t=='rev')b=rows('revise');
if(t=='learn')b=`<div class="card"><b>Explain-it ladder</b><p>For any topic, ask Claude in chat: (1) simple definition, (2) everyday language, (3) realistic Pakistan example, (4) key terms, (5) academic detail, (6) exam-style answer, (7) quiz me. Verify every statute and case citation against the official text before using it.</p></div>`;
return `<h2>LLB Academic Hub</h2>`+tabs('acad',[['tasks','Tasks'],['sub','Subjects & exams'],['rev','Topics to revise'],['learn','Learning method']])+b}
function well(){return `<h2>Wellbeing</h2><p class="mu">Private, stored only in this browser. Not a medical tool. If you feel unwell for long, talk to a trusted person or a professional.</p><h3>Check-ins</h3>${rows('checkins')}<h3>Journal</h3>${rows('journal')}<div class="card"><b>When you avoid work:</b> tap "Stuck?" on any task to name the obstacle and shrink the task.</div>`}
const wkc=p=>S.practices.filter(x=>0).length,pw=p=>(p.log||[]).filter(d=>d>=addD(-6)).length;
function tgl(id){const p=S.practices.find(x=>x.id==id);p.log=p.log||[];const i=p.log.indexOf(today());i<0?p.log.push(today()):p.log.splice(i,1);save();render()}
function faith(){return `<h2>Faith & character</h2><p class="mu">You define your own practices and values. This is for reflection, not scoring.</p>${rows('practices',{extra:r=>`<button class="b ${(r.log||[]).includes(today())?'p':''}" onclick="tgl('${r.id}')">${(r.log||[]).includes(today())?'Done today':'Mark today'}</button><span class="mu">${pw(r)}/7 </span>`})}<div class="card mu">Use the Journal under Wellbeing for weekly reflection. Check religious references with a qualified source.</div>`}
function rev(){const w=addD(-6),c=S.tasks.filter(t=>t.doneAt>=w),m=S.sessions.filter(s=>s.date>=w).reduce((a,s)=>a+s.mins,0),ck=S.checkins.filter(x=>x.date>=w),av=k=>ck.length?(ck.reduce((a,x)=>a+ +x[k],0)/ck.length).toFixed(1):'n/a',R={};
S.money.filter(x=>x.date>=w).forEach(x=>{const r=R[x.cur]=R[x.cur]||{r:0,e:0};if(x.type=='Payment received')r.r+=+x.amt;if(x.type=='Expense')r.e+=+x.amt});
const ob={};ck.forEach(x=>x.obs!='None'&&(ob[x.obs]=(ob[x.obs]||0)+1));const od=S.tasks.filter(over),fu=S.prospects.filter(p=>p.fdate&&p.fdate<=today());
const L=[['Tasks completed',c.length],['Tasks deferred',S.tasks.filter(t=>t.status=='Deferred').length],['Focus / study minutes logged',m],['Prospects added',S.prospects.filter(p=>p.created>=w).length],['Qualified prospects',S.prospects.filter(p=>p.stage=='Qualified').length],['Contacted',S.prospects.filter(p=>p.stage=='Contacted').length],['Verified live links',S.placements.filter(p=>p.status=='Live'&&p.vdate>=w).length],['Avg mood / energy / stress',av('mood')+' / '+av('energy')+' / '+av('stress')],['Common obstacles',Object.entries(ob).map(e=>e.join(' ×')).join(', ')||'none recorded'],['Income received / expenses',Object.entries(R).map(([k,v])=>`${k} ${v.r} / ${v.e}`).join('; ')||'none recorded'],['Faith practices done (total)',S.practices.reduce((a,p)=>a+pw(p),0)]];
const pr=[...od.slice(0,2).map(t=>'Clear overdue: '+t.title),...fu.slice(0,2).map(p=>'Follow up: '+p.domain)].slice(0,3);
return `<h2>Weekly review</h2><p class="mu">Last 7 days, from your actual records only.</p><div class="card">${L.map(([a,b])=>`<div style="display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--bd);padding:4px 0"><span>${a}</span><b>${esc(b)}</b></div>`).join('')}</div><h3>Suggested focus next week</h3><div class="card">${pr.map(x=>`<div>• ${esc(x)}</div>`).join('')||'<span class="mu">Add tasks and follow-up dates to get suggestions. Choose your own three priorities.</span>'}</div>`}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='life-os-backup-'+today()+'.json';a.click()}
function csv(k){const l=S[k];if(!l.length)return toast('Nothing to export');const h=[...new Set(l.flatMap(Object.keys))],c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h.join(',')+'\n'+l.map(r=>h.map(x=>c(r[x])).join(',')).join('\n')],{type:'text/csv'}));a.download=k+'.csv';a.click()}
function imp(f){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!confirm('Importing replaces ALL current data. Export a backup first if unsure. Continue?'))return;Object.assign(S,d);save();render();toast('Imported')}catch(e){toast('Invalid backup file')}};r.readAsText(f)}
function set(){return `<h2>Settings & backup</h2><div class="card"><b>Storage:</b> ${store?'This browser\'s local storage is working. Data stays on this device and browser only, and can be lost if you clear site data. Export backups regularly.':'<span class="wr">Local storage is blocked here. Changes will be lost when you close the page. Export JSON often.</span>'}<br><button class="b p" onclick="exp()">Export JSON backup</button>${['prospects','clients','placements','money','tasks'].map(k=>`<button class="b" onclick="csv('${k}')">CSV: ${k}</button>`).join('')}<br><label>Import JSON (replaces data)</label><input type="file" accept=".json" onchange="imp(this.files[0])"></div><div class="card"><b>Ethics reminder:</b> follow Google's spam policies and link-qualification guidance. Disclose paid placements with sponsored/nofollow where needed. Never promise rankings or invent metrics.</div>`}
// ---------- voice
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,NV={freelance:'free',crm:'crm','link building':'crm',prospect:'crm',pipeline:'crm',client:'crm',backlink:'crm',placement:'crm',academic:'acad',jurisprudence:'acad',study:'acad',law:'acad',assignment:'acad',wellbeing:'well',journal:'well',check:'well',faith:'faith',religious:'faith',character:'faith',weekly:'rev',review:'rev',progress:'rev',task:'plan',planner:'plan',today:'plan',timer:'plan',focus:'plan',home:'dash',dashboard:'dash',setting:'set',backup:'set',voice:'voice'};
function parse(raw){const t=raw.toLowerCase().replace(/[.!?]+$/,'').trim();if(!t)return null;let m;
if(/\b(delete|remove|erase|mark.*paid|send|email|publish)\b/.test(t))return{g:3,d:'Blocked: delete, payment and send actions are not available by voice. Do them manually.',run:null};
if(m=t.match(/^(?:add|create) (?:a )?(?:\w+ )?task:?\s*(.+)/))return{g:2,d:`Create task "${m[1]}" (category Freelance by default, no deadline)`,run:()=>{taskFrom(m[1],/study|assign|law/.test(m[1])?'Academic':'Freelance','Voice','');go('plan')}};
if(m=t.match(/(?:add|new) (?:a )?(?:website )?prospect\s*(.*)/)){const dm=raw.match(/[a-z0-9-]+(?:\.[a-z0-9-]+)*\.[a-z]{2,}/i);return dm?{g:2,d:`Add prospect ${dm[0].toLowerCase()} (edit the domain below if wrong)`,run:()=>{tab.crm='prospects';go('crm');edit('prospects',0,{domain:dm[0].toLowerCase()})}}:{g:0,d:'I need a domain, e.g. "add prospect example.com". I will not guess one.',run:null}}
if(m=t.match(/start (?:a |my )?(\d+)[ -]?minute/))return{g:1,d:`Start a ${m[1]}-minute focus timer`,run:()=>startT(+m[1])};
if(/start .*(timer|focus)/.test(t))return{g:1,d:'Start a 25-minute focus timer',run:()=>startT(25)};
if(/pause/.test(t))return{g:1,d:'Pause timer',run:pauseT};if(/resume/.test(t))return{g:1,d:'Resume timer',run:resumeT};if(/stop.*(timer|focus|session)/.test(t))return{g:1,d:'Stop timer',run:stopT};
if(/overdue/.test(t))return{g:1,d:'Show overdue tasks',run:()=>{q.pf='over';go('plan')}};
if(/weekly progress|how much.*(week)/.test(t))return{g:1,d:'Open weekly review',run:()=>go('rev')};
if(/^(open|show|go to|take me to)\b/.test(t)){const k=Object.keys(NV).find(k=>t.includes(k));if(k)return{g:1,d:'Open '+NV[k]+' section',run:()=>go(NV[k])}}
return{g:0,d:'Command not understood. Try: "open freelance HQ", "add task: evaluate five websites", "add prospect example.com", "start a 25 minute focus session".',run:null}}
function vstate(s){V.state=s;if(view=='voice')render()}
function interpret(){V.text=$('#vt').value;V.cmd=parse(V.text);if(!V.cmd){V.state='Ready';return render()}
if(V.cmd.run&&V.cmd.g==1){V.cmd.run();V.state='Command completed';V.cmd=null;if(view=='voice')render();return}
V.state=V.cmd.run?'Waiting for confirmation':'Command not understood';render()}
function confirmV(){if(V.cmd&&V.cmd.run){V.cmd.run();V.state='Command completed';V.cmd=null;if(view=='voice')render()}}
function cancelV(){V.cmd=null;V.state='Ready';render()}
function mic(){if(!SR){return vstate('Unsupported browser')}if(V.rec){V.rec.stop();return}
const r=new SR();r.lang=$('#vl').value;r.interimResults=false;r.maxAlternatives=1;V.rec=r;
r.onstart=()=>vstate('Listening');r.onspeechend=()=>vstate('Processing speech');
r.onresult=e=>{V.text=e.results[0][0].transcript;V.cmd=parse(V.text);if(V.cmd&&V.cmd.run&&V.cmd.g==1){V.cmd.run();V.state='Command completed';V.cmd=null}else V.state=V.cmd&&V.cmd.run?'Waiting for confirmation':'Command not understood';render()};
r.onerror=e=>{V.rec=null;vstate(e.error=='not-allowed'||e.error=='service-not-allowed'?'Microphone permission denied':e.error=='no-speech'?'No speech detected':e.error=='language-not-supported'?'Language not supported, pick another':'Speech recognition error: '+e.error)};
r.onend=()=>{V.rec=null;if(V.state=='Listening'||V.state=='Processing speech')V.state='Ready';render()};
try{r.start()}catch(x){V.rec=null;vstate('Speech recognition error')}}
function voice(){const L=[['en-US','English (US)'],['en-GB','English (UK)'],['ur-PK','Urdu (Pakistan) if supported'],['en-PK','English (Pakistan)']];
return `<h2>Voice commands</h2><div class="card"><b>Status: ${esc(V.state)}</b>${V.rec?' <span class="wr">● Microphone ON</span>':' <span class="mu">Microphone off</span>'}<p class="mu">${SR?'This browser exposes speech recognition. It may send audio to the browser vendor\'s service. Listening starts only when you press the mic, one command at a time, and no audio is stored. Whether it works inside this page is untested until you try it.':'Speech recognition is not available in this browser. Use the text box below, it works the same way.'}</p>
<button class="b p" style="font-size:18px;padding:12px 20px" onclick="mic()" ${SR?'':'disabled'}>${V.rec?'⏹ Stop listening':'🎤 Start listening'}</button> <select id="vl" style="max-width:220px;display:inline-block">${L.map(l=>`<option value="${l[0]}">${l[1]}</option>`).join('')}</select>
<label>Transcript (editable) or type a command</label><input id="vt" value="${esc(V.text)}" onkeydown="if(event.key=='Enter')interpret()"><button class="b" onclick="interpret()">Interpret</button></div>
${V.cmd?`<div class="card"><b>Detected:</b> ${esc(V.cmd.d)}${V.cmd.run?`<br><button class="b p" onclick="confirmV()">Confirm</button><button class="b" onclick="cancelV()">Cancel</button>`:''}</div>`:''}
<div class="card mu">Language is never switched silently. Mixed English-Urdu recognition is not guaranteed. Safe commands (open, show, timer) run at once; saving data needs your confirmation; deleting and payments are blocked by voice.</div>`}
const VW={dash,plan,free,crm,acad,well,faith,voice,rev,set};
function render(k){const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;
$('#nav').innerHTML='<h1>My Life OS</h1>'+NAV.map(n=>`<button class="${n[0]==view?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');
$('#v').innerHTML=VW[view]();bar();if(id&&$('#'+id)){$('#'+id).focus();try{$('#'+id).setSelectionRange(pos,pos)}catch(e){}}}
render();
</script></body></html>
